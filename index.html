<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link href="assets/css/style.css" rel="stylesheet">
        <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0'>
        <link rel="shortcut icon" href="images/smLogoTransparent.png" type="image/webp">
        <link rel="apple-touch-icon" sizes="180x180" href="images/smLogoTransparent.png">
        <link rel="icon" href="images/smLogoTransparent.png" type="image/webp">
        <title>Stories for Mortals</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- Snowfall Background Animation -->
        <section class="animated-background">
            <div id="stars1"></div>
            <div id="stars2"></div>
            <div id="stars3"></div>
        </section>
        <!-- End of Snowfall Background Animation -->

        <div class="min-h-full flex-h-center" id="background_div">
            <input type="hidden" value="https://bio.link" id="app-url">
                <input type="hidden" value="null" id="is-featured">
                    <canvas id="bg-canvas" class="background-overlay"></canvas>
                </input>
            </input>

            <div class="mt-48 page-full-wrap relative ">
                <input type="hidden" value="creator-page" id="page-type">
                <img class="display-image m-auto" data-src="assets/images/smLogo.png" src="assets/images/smLogo.png" alt="[Your photo alt]"/>
                <h2 class="page-title page-text-color page-text-font mt-16 text-center">Stories for Mortals</h2>
                       
                <div class="mt-24">
                    <div class="page-item-wrap relative">
                        <div class="page-item flex-both-center absolute"></div>
                        <a target="_blank"  class="page-item-each py-10 flex-both-center" href="https://frugalfrigate.com/search/merchandise?q=stories%20for%20mortals" data-id="261652" data-type="page_item">
                            <img class="link-each-image" data-src="assets/images/zines.png" src="assets/images/zines.png" alt="Purchase an Issue"/>
                            <span class=" item-title text-center">Purchase an Issue</span>
                        </a>
                    </div>        
                    <div class="page-item-wrap relative">
                        <div class="page-item flex-both-center absolute"></div>
                        <a target="_blank"  class="page-item-each py-10 flex-both-center" href="https://docs.google.com/forms/d/e/1FAIpQLSfaevgBrQCK_45ns3jtvUb-h8_hHDg1x3o9UWyIGO3h6Q_Mag/viewform?usp=publish-editor" data-id="261685" data-type="page_item">
                            <img class="link-each-image" data-src="assets/images/typewriter.png" src="assets/images/typewriter.png" alt="Submit a Story"/>
                            <span class=" item-title text-center">Submit a Story</span>
                        </a>
                    </div>    
                    <div class="page-item-wrap relative">
                        <div class="page-item flex-both-center absolute"></div>
                        <a target="_blank"  class="page-item-each py-10 flex-both-center" href="https://frugalfrigate.com/events/calendar" data-id="261685" data-type="page_item">
                            <img class="link-each-image" data-src="assets/images/calendar.png" src="assets/images/calendar.png" alt="Attend the Open Mic (4th Sunday)"/>
                            <span class=" item-title text-center">Attend the Open Mic<br>(4th Sunday @ 7pm)</span>
                        </a>
                    </div>                                  
                </div>                                                                                
            </div>
        </div>
    </body>

    <!--
    A different snowfall    
    <script  src="assets/js/snowfall.js"></script>
    -->
</html>
